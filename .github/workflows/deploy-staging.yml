# Deploy staging — push to `main` deploys to the STAGING preview.
#
# One job, in order: build stamp -> gates -> deploy -> smoke check.
# The deploy goes out with --branch=main, which makes it a PREVIEW
# deployment on main.sunup-finder.pages.dev — never production.
# The `staging` environment holds the staging-scoped Cloudflare token and
# has NO required reviewers: staging deploys are automatic on merge to
# main. It must NOT have access to the production token.
# Third-party actions are pinned to full commit SHAs (see README).

name: Deploy staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

# One staging deploy at a time; a newer push cancels an in-flight staging
# deploy (safe for staging — never do this for production).
concurrency:
  group: staging
  cancel-in-progress: true

jobs:
  deploy:
    name: Stage (preview)
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Check out (full history — gitleaks scans it all)
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "20"

      - name: Inject build stamp
        env:
          ENVIRONMENT: staging
        run: node scripts/build-version.mjs

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        with:
          args: detect --source . --redact --exit-code 1

      - name: Shell gates (JS syntax, http assets, size, required files, HTML)
        run: ./scripts/gates.sh

      - name: Link check (static files)
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --no-progress --format detailed --timeout 20 --max-retries 1 --exclude 'https://colonywestccpc\.ezlinksgolf\.com/.*' --exclude 'https://palmbeachnational\.com/.*' --exclude 'https://country-club-of-coral-springs\.book\.teeitup\.com/.*' --root-dir public public/index.html public/privacy.html public/terms.html
          fail: true

      - name: Deploy to Cloudflare Pages (branch=main, preview)
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          # --branch=main makes this a PREVIEW deployment, never production.
          # --commit-hash / --commit-message tie it to this exact commit.
          command: pages deploy ./public --project-name=sunup-finder --branch=main --commit-hash=${{ github.sha }} --commit-message="${{ github.event.head_commit.message }}"

      - name: Smoke-check the staging URL
        run: ./scripts/smoke.sh "https://main.sunup-finder.pages.dev" "${{ github.sha }}"
