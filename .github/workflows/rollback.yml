# Roll back production — manual only (workflow_dispatch).
#
# DISPATCH FROM THE `prod` BRANCH. The production environment only allows
# deployments from prod, so a dispatch from main is rejected in seconds.
#
# Instant rollback to a previous PRODUCTION deployment via the Cloudflare
# Pages API. Wrangler has no rollback command, so this workflow is the
# one-click path; the dashboard (Deployments -> ... -> Rollback) is the
# break-glass alternative. Only a successful production deployment is a
# valid rollback target — preview deployments are not.
#
# The job runs in the `production` environment, so it reads the production
# token AND goes through the same required-reviewer approval as a deploy.
# Find the deployment ID first:
#   npx wrangler pages deployment list --project-name sunup-finder --environment production
# After rollback, fix forward: revert the bad change on main, let staging
# verify it, fast-forward merge to prod, redeploy normally. Do not deploy
# a fix directly to prod outside the pipeline.

name: Roll back production

on:
  workflow_dispatch:
    inputs:
      deployment_id:
        description: "Production deployment ID to roll back to"
        required: true
      reason:
        description: "Why (recorded in the run summary)"
        required: false

permissions:
  contents: read

# One production operation at a time; a rollback must never race a prod
# deploy. Same group as deploy-prod.yml, never cancel mid-flight.
concurrency:
  group: production
  cancel-in-progress: false

jobs:
  rollback:
    name: Roll back production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Roll back via Cloudflare API
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          echo "Rolling back to deployment ${{ inputs.deployment_id }} (reason: ${{ inputs.reason }})"
          curl -fsS -X POST "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/sunup-finder/deployments/${{ inputs.deployment_id }}/rollback" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            | tee rollback-response.json
          {
            echo "## Rollback"
            echo ""
            echo "- Deployment rolled back to: \`${{ inputs.deployment_id }}\`"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"

      # No expected SHA after a rollback — liveness-only check. Pre-pipeline
      # builds have no version.json, so the strict smoke check would call a
      # good rollback a failure. --liveness asserts liveness + headers +
      # supporting pages and prints the live commit only if version.json
      # exists.
      - name: Verify what is live
        run: ./scripts/smoke.sh --liveness "https://sunuptee.com"
