# Keep the pinned GitHub Actions up to date. All actions in this repo are
# pinned to full commit SHAs; Dependabot proposes the updates as PRs so the
# pins do not go stale silently. Merge a Dependabot PR only after CI gates
# pass on it, same as any other change.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
